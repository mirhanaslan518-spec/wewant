<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0C0C0E; }
    body { display:flex; justify-content:center; align-items:center; font-family:-apple-system, sans-serif; color:#9A9599; }
  </style>
</head>
<body>
  <div class="cf-turnstile" data-sitekey="0x4AAAAAAEHsHJmkyCGhuPCZ" data-callback="onVerify"></div>
  <script>
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    function onVerify(token) {
      const redirect = getParam('redirect');
      if (redirect) {
        var sep = redirect.indexOf('?') !== -1 ? '&' : '?';
        window.location.href = redirect + sep + 'token=' + encodeURIComponent(token);
      }
    }
  </script>
</body>
</html>
