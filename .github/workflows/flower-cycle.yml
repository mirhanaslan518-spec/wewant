name: Flower Cycle Advance

on:
  schedule:
    # Her saat başı çalışır — çiçeğin bir sonraki güne geçmesi ya da
    # solması gereken an geldiğinde bunu işler.
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: advance_flower_cycles çağır
        run: |
          curl -s -o /dev/null -w "HTTP durum kodu: %{http_code}\n" \
            -X POST \
            "https://mviagfelozflanfxtlcl.supabase.co/rest/v1/rpc/advance_flower_cycles" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
